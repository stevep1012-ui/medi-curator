name: medi-curator release pipeline

on:
  pull_request:
    branches: [main]
    # Gate 5+6 은 PR 라벨을 읽어 판정한다. 기본 타입(opened/synchronize/reopened)만
    # 듣던 동안에는 라벨을 붙여도 게이트가 재평가되지 않았고, 실패한 실행을 재실행해도
    # 원래 이벤트 페이로드를 그대로 쓰므로 라벨이 반영되지 않았다. 즉 마지막 푸시
    # 이전에 라벨이 있어야만 통과하는 구조여서 사실상 통과가 불가능했다.
    # labeled/unlabeled 를 추가해 라벨 부여·해제가 즉시 게이트에 반영되게 한다.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# 액션 버전 주의 — 여기엔 Node 축이 둘 있고 서로 다르다.
#
# (1) 액션 자체의 실행 런타임. checkout/setup-node v4, github-script v7,
#     gitleaks-action v2 는 모두 Node 20 에서 돌아 실행마다 지원 종료 경고가 붙었다.
#     아래 node-version 을 올려도 이 경고는 사라지지 않는다 — 다른 축이기 때문이다.
#     현재 핀(v7/v7/v9/v3)은 모두 node24 다(각 action.yml 의 runs.using 으로 확인).
#     2026-09-16 부터 러너에서 Node 20 이 제거되므로 이 핀들은 유지 필수다.
#
# (2) 워크플로가 설치하는 Node(node-version). 22 를 유지한다. functions 배포 런타임이
#     nodejs22 이고 Node 22 는 아직 LTS 다. nodejs24 는 firebase-tools #9500
#     (배포 시 GA 아님) 때문에 보류하며, 올릴 때는 functions 의 engines.node 와
#     @types/node 를 함께 옮겨야 한다.
permissions:
  contents: read
  pull-requests: write

jobs:
  gate-static:
    name: Gate 1 — STATIC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so gitleaks can resolve the commit range
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: node scripts/scan-secrets.mjs
      - name: gitleaks
        # v3 는 런타임만 node20 → node24 로 옮긴 릴리스다(입력·출력·동작 변경 없음).
        # 2026-09-16 부터 러너에서 Node 20 이 제거되어 v2 는 우회 플래그로도 동작하지
        # 않으므로 선택이 아니라 기한이 있는 변경이다.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate-security:
    name: Gate 3 — SEC
    runs-on: ubuntu-latest
    needs: gate-static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build
      - name: Bundle secret scan
        run: node scripts/scan-bundle.mjs dist
      - run: npm audit --omit=dev --audit-level=high

  gate-qa:
    name: Gate 7 — QA
    runs-on: ubuntu-latest
    needs: gate-static
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm test -- --coverage || echo "테스트 미구현 — qa-engineer 호출 필요"

  gate-legal-medical:
    name: Gate 5+6 — LEGAL & MED (label required)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Require legal/medical approval labels for prompt/i18n changes
        uses: actions/github-script@v9
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const sensitive = files.some(f => /geminiService|translations|DisclaimerBanner|SymptomInput|mfds-otc|forbidden-phrases/.test(f.filename));
            if (!sensitive) return;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const need = ['legal-approved','medical-approved'].filter(l => !labels.includes(l));
            if (need.length) core.setFailed(`민감 변경 감지. 필수 라벨 누락: ${need.join(', ')}`);

  release-decision:
    name: Gate 8 — RELEASE
    runs-on: ubuntu-latest
    needs: [gate-static, gate-security, gate-qa]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "모든 자동 게이트 통과. release-manager 가 카나리 진행."
